name: Bootstrap Wails v3 & Lockfiles

on:
  workflow_dispatch:
    inputs:
      add_sqlite:
        description: 'Resolve and pin modernc.org/sqlite in go.mod/go.sum'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  bootstrap:
    name: Generate go.sum, Wails v3.1.0 build assets, and TS bindings
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.15.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend dist
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.10'

      - name: Install Wails v3.1.0 CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
          "$env:USERPROFILE\go\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Resolve Go dependencies & generate go.sum
        shell: pwsh
        run: |
          if ("${{ inputs.add_sqlite }}" -eq "true") {
            go get modernc.org/sqlite@v1.46.1
          }
          go mod tidy
          go mod verify

      - name: Extract Wails v3.1.0 reference Taskfile and build assets
        shell: pwsh
        run: |
          wails3 init -n "LD Studio" -t react -d _wails_ref --skipgomodtidy

      - name: Generate TypeScript bindings
        shell: pwsh
        run: |
          wails3 generate bindings -ts -d frontend/src/generated/wails

      - name: Stage bootstrap bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path _bootstrap_out | Out-Null
          Copy-Item go.mod, go.sum -Destination _bootstrap_out/
          Copy-Item _wails_ref/Taskfile.yml -Destination _bootstrap_out/Taskfile.yml -ErrorAction SilentlyContinue
          if (Test-Path _wails_ref/build) {
            Copy-Item _wails_ref/build -Destination _bootstrap_out/build -Recurse
          }
          if (Test-Path frontend/src/generated/wails) {
            Copy-Item frontend/src/generated/wails -Destination _bootstrap_out/bindings -Recurse
          }

      - name: Upload bootstrap-bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bootstrap-bundle-${{ github.sha }}
          path: _bootstrap_out/
          retention-days: 7
