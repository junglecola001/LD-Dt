name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Checks (Mock UI)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.15.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit & Component Tests
        run: pnpm test

      - name: Production Bundle Check
        run: pnpm build

  go-check:
    name: Go Format, Vet & Business Tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.15.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend assets for Go embed
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: go.sum

      - name: Verify gofmt
        shell: pwsh
        run: |
          $unformatted = gofmt -l .
          if ($unformatted) {
            gofmt -d .
            Write-Error "Go source needs formatting:`n$unformatted"
            exit 1
          }

      - name: Verify modules
        shell: pwsh
        run: |
          if (Test-Path go.sum) {
            $env:GOFLAGS = '-mod=readonly'
            go mod verify
          } else {
            Write-Host "go.sum not yet bootstrapped; downloading modules for CI check"
            go mod tidy
          }

      - name: Go vet & test
        shell: pwsh
        run: |
          if (Test-Path go.sum) {
            $env:GOFLAGS = '-mod=readonly'
          }
          go vet ./...
          go test -v ./...

  ci-status:
    name: CI Status Gate
    runs-on: ubuntu-latest
    needs: [frontend, go-check]
    if: always()
    steps:
      - name: Evaluate required checks
        run: |
          if [ "${{ needs.frontend.result }}" != "success" ] || [ "${{ needs.go-check.result }}" != "success" ]; then
            echo "Required CI checks failed: frontend=${{ needs.frontend.result }} go-check=${{ needs.go-check.result }}"
            exit 1
          fi
