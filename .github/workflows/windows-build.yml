name: Windows Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    paths:
      - 'main.go'
      - 'go.mod'
      - 'go.sum'
      - 'Taskfile.yml'
      - 'internal/**'
      - 'build/**'
      - 'frontend/**'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            run_host_tests: true
          - arch: arm64
            run_host_tests: false

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.15.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: go.sum

      - name: Install Wails v3.1.0 CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
          "$env:USERPROFILE\go\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify modules & generate bindings
        shell: pwsh
        run: |
          if (Test-Path go.sum) {
            $env:GOFLAGS = '-mod=readonly'
            go mod verify
          } else {
            go mod tidy
          }
          wails3 generate bindings -ts -d frontend/src/generated/wails

      - name: Run Go tests (host architecture only)
        if: matrix.run_host_tests
        shell: pwsh
        run: |
          if (Test-Path go.sum) { $env:GOFLAGS = '-mod=readonly' }
          go test -v ./...

      - name: Ensure NSIS (makensis) is available
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            $nsisDefault = "C:\Program Files (x86)\NSIS"
            if (Test-Path "$nsisDefault\makensis.exe") {
              $nsisDefault | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            } else {
              choco install nsis -y --no-progress
              $nsisDefault | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }

      - name: Build & Package Windows (${{ matrix.arch }})
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          $stageDir = "dist/staging-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null

          $env:GOOS = 'windows'
          $env:GOARCH = '${{ matrix.arch }}'
          if (Test-Path go.sum) { $env:GOFLAGS = '-mod=readonly' }

          if (Test-Path 'build/windows/Taskfile.yml') {
            wails3 package GOOS=windows ARCH=${{ matrix.arch }} INSTALL_SCOPE=user
            if ($LASTEXITCODE -ne 0) { throw "wails3 package failed with exit code $LASTEXITCODE" }
            if (Test-Path "bin/LD-Studio.exe") {
              Copy-Item "bin/LD-Studio.exe" -Destination "$stageDir/LD-Studio.exe" -Force
            }
            Get-ChildItem -Path "bin" -Filter "*-installer.exe" -ErrorAction SilentlyContinue | ForEach-Object {
              Copy-Item $_.FullName -Destination "dist/$($_.Name)" -Force
            }
          } else {
            go build -ldflags="-s -w -H windowsgui" -o "$stageDir/LD-Studio.exe" .
            if ($LASTEXITCODE -ne 0) { throw "go build failed with exit code $LASTEXITCODE" }
          }

          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md, README.md -Destination $stageDir/
          $manifest = @{
            app = "LD Studio"
            commit = "${{ github.sha }}"
            goarch = "${{ matrix.arch }}"
            hostTestsExecuted = ("${{ matrix.run_host_tests }}" -eq "true")
            goVersion = (go version)
            authenticodeSigned = $false
            updaterSigned = $false
          } | ConvertTo-Json
          $manifest | Out-File -FilePath "$stageDir/build-manifest.json" -Encoding utf8

          $zipPath = "dist/LD-Studio-windows-${{ matrix.arch }}-$shortSha.zip"
          Compress-Archive -Path "$stageDir/*" -DestinationPath $zipPath -Force
          Get-ChildItem -Path "dist" -File | Where-Object { $_.Extension -in '.zip', '.exe' } | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          } | Out-File -FilePath "dist/SHA256SUMS-${{ matrix.arch }}.txt" -Encoding utf8

      - name: Upload Windows artifacts (${{ matrix.arch }})
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ld-studio-windows-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS-*.txt
            dist/staging-${{ matrix.arch }}/build-manifest.json
          retention-days: 14
